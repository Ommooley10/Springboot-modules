spring.application.name=module4

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false
spring.datasource.username=root
spring.datasource.password=Ommooley@2004

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled = true

server.port= 9000

#logging configuration
logging.level.com.codingshuttle.om.module4.clients= DEBUG
logging.pattern.console= %d{dd-mm-yyyy hh:MM:ss} [%level] [%c{2.}] --- %m%n
logging.file.name= application.log
logging.config= classpath:logback-spring.xml

#actuator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled= true
info.app.author= Om Mooley
info.app.version= "1.0.0"
info.app.documentation= "https://testurl.com"
management.endpoint.env.show-values= always
management.info.build.enabled= true
management.info.git.enabled= true
management.info.java.enabled= true
management.info.os.enabled= true
#actuator is used to show information about application like version, author, documentation or monitor the overall health of application